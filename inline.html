<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block & Inline Elements</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        color: #2e63f5;
        margin-bottom: 30px;
    }

    .container {
        display: flex;
        justify-content: center;
        gap: 60px;
    }

    /* BLOCK ELEMENT SECTION */
    .block-section {
        border: 3px solid #2e63f5;
        width: 250px;
        padding: 20px;
        border-radius: 12px;
    }

    .block-box {
        border: 2px solid #2e63f5;
        padding: 15px;
        margin-top: 15px;
        border-radius: 8px;
        background-color: #f3f7ff;
    }

    /* INLINE SECTION */
    .inline-section {
        border: 3px solid #f0b23a;
        width: 550px;
        padding: 20px;
        border-radius: 12px;
        display: inline-block;
    }

    .inline-box {
        display: inline-block;
        border: 2px solid #f0b23a;
        padding: 15px 20px;
        margin: 10px;
        border-radius: 8px;
        background-color: #fffaf1;
    }

    .label {
        font-size: 18px;
        font-weight: bold;
        margin-top: 10px;
    }
</style>
</head>
<body>

<h1>Major Versions of HTML</h1>

<div class="container">

    <!-- BLOCK LEVEL -->
    <div>
        <div class="block-section">
            <div class="block-box">Box 1</div>
            <div class="block-box">Box 2</div>
            <div class="block-box">Box 3</div>
            <div class="block-box">Box 4</div>
        </div>
        <p class="label">Block-Level Element</p>
    </div>

    <!-- INLINE LEVEL -->
    <div>
        <div class="inline-section">
            <span class="inline-box">Box 1</span>
            <span class="inline-box">Box 2</span>
            <span class="inline-box">Box 3</span>
            <span class="inline-box">Box 4</span>
        </div>
        <p class="label">Inline Element</p>
    </div>

</div>

</body>
</html>
